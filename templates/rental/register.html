{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" style="max-width:400px;">
  {% csrf_token %}
  {% for field in form %}
  <div class="form-group">
    <label>{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}<div style="color:var(--danger);font-size:0.85rem;">{{ field.errors }}</div>{% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn">Зарегистрироваться</button>
</form>
<p style="margin-top:12px;">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
{% endblock %}
