{% extends "base.html" %}
{% block title %}Оформление выдачи{% endblock %}
{% block content %}
<h1>Оформление выдачи</h1>
<form method="post" style="max-width:480px;">
  {% csrf_token %}
  {% for field in form %}
  <div class="form-group">
    <label>{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}<div style="color:var(--danger);">{{ field.errors }}</div>{% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn">Оформить выдачу</button>
</form>
{% endblock %}
